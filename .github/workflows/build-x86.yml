name: Build aeon-vllm-x86 (sm_120)

# Triggers: any push that touches build-relevant files on the x86 branch,
# plus manual dispatch for on-demand rebuilds (e.g. after pinning updates).
on:
  push:
    branches:
      - feat/x86_64-sm120
      - main
    paths:
      - Dockerfile.x86_64
      - patches/**
      - humming-stub/**
      - verify.py
      - .github/workflows/build-x86.yml
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Disable Docker layer cache (full rebuild — will be very slow, ~5h)"
        type: boolean
        default: false

# Minimal token scope: read repo, write packages (push to ghcr.io)
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/aeon-vllm-x86
  # Layer cache stored as a separate GHCR tag — survives across runs
  CACHE_REF: ghcr.io/${{ github.repository_owner }}/aeon-vllm-x86:buildcache

jobs:
  build:
    name: Docker build — x86_64 + sm_120
    # GitHub-hosted runner: free for public repos, no GPU needed for compilation.
    # CUDA kernel compilation works offline (nvcc produces .cubin without a GPU present).
    #
    # Speed strategy:
    #   - FIRST build: run locally with ./build-x86_64.sh --push-cache
    #     This uploads compiled layers to GHCR buildcache (~15 GB).
    #   - Subsequent runs here: only rebuild layers whose inputs changed.
    #     If only patches/ or compose changed, vLLM compilation is cached → ~5 min.
    #   - Full rebuild (no cache): expect 4-6h on the 2-core runner.
    #     Set timeout-minutes to 350 to survive it.
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker-container driver (default) supports registry cache; docker driver does not.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sm120
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.x86_64
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry cache: pull warm layers from GHCR, push updated layers back.
          # Primed by the first local build (./build-x86_64.sh --push-cache).
          # mode=max caches every intermediate layer, not just the final image.
          cache-from: type=registry,ref=${{ env.CACHE_REF }}
          cache-to: ${{ inputs.no_cache != true && format('type=registry,ref={0},mode=max', env.CACHE_REF) || '' }}
          no-cache: ${{ inputs.no_cache == true }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Report pushed tags
        env:
          PUSHED_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "=== Pushed tags ==="
          echo "$PUSHED_TAGS"
          echo "Pull command:"
          echo "  docker pull ghcr.io/${{ env.IMAGE_NAME }}:sm120"
