# Jarvis — AEON vLLM x86_64 + sm_120 compose
# Replaces /boot/config/plugins/compose.manager/projects/aeon_vllm/docker-compose.yml
#
# Build the image first on the Unraid host:
#   cd /path/to/vllm-x86-sm120 && ./build-x86_64.sh
#
# ARCHITECTURE:
#   LiteLLM → sanitizer:8001 → aeon_vllm:8000
#   ^^ Point LiteLLM / OpenWebUI at port 8001, not 8000.
#   The sanitizer fixes malformed tool_call JSON in history before vLLM sees it.
#
# NVFP4 KV cache notes (sm_120):
#   - --kv-cache-dtype nvfp4  → works with MTP/EAGLE3 (causal speculator, Triton path)
#   - --kv-cache-dtype auto   → BF16, required when using DFlash speculator
#   Current config uses MTP (AEON Qwen3.6-27B-MTP-XS) → nvfp4 KV is ENABLED

services:
  # ── Tool-call JSON sanitizer ────────────────────────────────────────────────
  # Fixes malformed arguments (e.g. trailing '}') in tool_call history before
  # they reach vLLM's json.loads(). Stateless, fast, ~10ms overhead per request.
  # Point LiteLLM/OpenWebUI at this port instead of vLLM directly.
  sanitizer:
    build:
      context: ./sanitizer
      dockerfile: Dockerfile
    container_name: aeon_sanitizer
    restart: unless-stopped
    environment:
      - VLLM_BASE_URL=http://aeon_vllm:8000
      - LOG_FIXES=1
    ports:
      - "8001:8001"
    depends_on:
      - aeon_vllm
    networks:
      - aeon_net

  # ── vLLM inference server ───────────────────────────────────────────────────
  aeon_vllm:
    image: ghcr.io/enricoferrero64/aeon-vllm-x86:sm120
    container_name: aeon_vllm
    restart: unless-stopped
    runtime: nvidia

    # HF token loaded from .env file (not committed — see .env.example)
    # Create /boot/config/plugins/compose.manager/projects/aeon_vllm/.env with:
    #   HF_TOKEN=hf_yourtoken
    env_file:
      - path: .env
        required: false

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}

      # Triton NVFP4 KV: requires causal attention backend (MTP), NOT DFlash.
      # Quality notes for long contexts:
      #   - NVFP4 (e2m1, 4-bit) uses 1 scale per block_size tokens.
      #     Smaller block-size = finer scale granularity = less error accumulation.
      #     Current: --block-size 32 (good bandwidth/quality balance).
      #     For quality-critical workloads > 80K ctx, use docker-compose.fp8kv-quality.yml
      #     (FP8 KV, block-size 16, max-model-len 65536).
      #   - GatedDeltaNet (Mamba/SSM) layers in Qwen3.6 use float16 SSM state,
      #     NOT KV cache → those layers are unaffected by NVFP4 quantization.
      #   - Prefix caching protects system prompt tokens from re-quantization.
      - VLLM_ATTENTION_BACKEND=FLASH_ATTN

      # 0.92 is safe on dedicated GDDR7 VRAM (vs 0.88 limit on Spark's unified LPDDR5X).
      # Gives ~+0.6 GB KV cache per GPU = ~+180k extra token capacity at NVFP4.
      - VLLM_GPU_MEMORY_UTILIZATION=0.92

      # --- Blackwell PCIe (sm_120, no NVLink) NCCL fixes ---
      # vLLM's SymmMemCommunicator does not support sm_120; custom all-reduce
      # hangs at worker init on PCIe Blackwell. NCCL handles comms instead.
      # Source: vLLM Forums 2026 + informatico-madrid/blackwell-linux-infra-optimizer
      - NCCL_DMABUF_ENABLE=1
      - NCCL_P2P_LEVEL=PCI

      # Prevent CUDA memory fragmentation under long-running inference.
      # max_split_size_mb=512 avoids large contiguous alloc failures.
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512,garbage_collection_threshold:0.8

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    ports:
      - "8000:8000"   # internal only — clients should use sanitizer:8001

    networks:
      - aeon_net

    volumes:
      # HuggingFace model cache — adjust path to your Unraid array share
      - /mnt/user/appdata/aeon/models:/root/.cache/huggingface

    command:
      - "-c"
      - |
        python3 -m vllm.entrypoints.openai.api_server \
          --model AEON-7/Qwen3.6-27B-Multimodal-NVFP4-MTP-XS \
          --tensor-parallel-size 2 \
          --quantization modelopt \
          --kv-cache-dtype nvfp4 \
          --max-model-len 131072 \
          --gpu-memory-utilization 0.92 \
          --enforce-eager false \
          --speculative-config '{"method":"qwen3_5_mtp","num_speculative_tokens":4}' \
          \
          --mamba-block-size 256 \
          --mamba-cache-dtype float16 \
          \
          --mm-encoder-tp-mode data \
          --limit-mm-per-prompt "image=4,video=1" \
          \
          --enable-prefix-caching \
          --enable-chunked-prefill \
          --max-num-seqs 8 \
          --max-num-batched-tokens 8192 \
          --block-size 32 \
          \
          --disable-custom-all-reduce \
          \
          --reasoning-parser qwen3 \
          --tool-call-parser qwen3_coder \
          --enable-auto-tool-choice \
          \
          --host 0.0.0.0 \
          --port 8000

    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

    # 16GB shm for NCCL TP=2 inter-GPU tensor buffers.
    # 2GB is insufficient under sustained TP=2 load with 27B model.
    shm_size: "16gb"
    ulimits:
      memlock: -1
      stack: 67108864

networks:
  aeon_net:
    driver: bridge
